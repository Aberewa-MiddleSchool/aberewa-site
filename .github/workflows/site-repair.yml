name: Apply sitewide repairs

on:
  push:
    branches:
      - main
      - site-audit-fixes-2026-07
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply repository-wide repairs
        run: python scripts/repair_site.py

      - name: Connect sitewide gold Adinkra theme
        run: python scripts/apply_adinkra_theme.py

      - name: Verify public site requirements
        shell: bash
        run: |
          if grep -R --include='*.html' -n 'antoinelamond@gmail.com' .; then
            echo 'Old email address remains in HTML.' >&2
            exit 1
          fi
          if grep -R --include='*.html' -n 'hits.sh' .; then
            echo 'Public hit counter remains in HTML.' >&2
            exit 1
          fi
          while IFS= read -r page; do
            if ! grep -q 'sitewide-adinkra.css' "$page"; then
              echo "Gold Adinkra theme is not connected to $page" >&2
              exit 1
            fi
          done < <(find . -maxdepth 1 -name '*.html' -print | sort)
          test -f sitewide-adinkra.css
          test -f accessibility.html
          test -f privacy.html
          test -f faq.html
          test -f sitemap.xml
          test -f robots.txt

      - name: Commit repaired site
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo 'No additional repairs needed.'
            exit 0
          fi
          git config user.name 'Aberewa Site Repair'
          git config user.email 'founder@aberewamiddleschool.org'
          git add -A
          git commit -m 'Apply sitewide repairs and gold Adinkra theme [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
