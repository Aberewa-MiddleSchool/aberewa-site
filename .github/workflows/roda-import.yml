name: Import school arcade assets
on:
  push:
    branches: [school-roda-asset-import-45]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify release files
        run: python .github/roda-import.py
      - name: Save verified school arcade files
        run: |
          git config user.name "Aberewa arcade import"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roda-arcade
          git commit -m "Store verified RODA release assets for the school website"
          git push origin HEAD:school-roda-asset-import-45
