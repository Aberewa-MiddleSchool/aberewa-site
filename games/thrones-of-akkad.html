<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thrones of Akkad — Play</title>
<meta name="description" content="Play Thrones of Akkad, the controller-only twelve-goddess fighting game prototype.">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#090610;color:#ffdfab;font-family:Georgia,'Times New Roman',serif}
body{min-height:100vh;display:grid;place-items:center;padding:20px}
main{width:min(690px,100%);border:1px solid #9f7c47;background:linear-gradient(155deg,#25132e,#0c0710);box-shadow:0 22px 90px #0009;padding:clamp(20px,4vw,44px);text-align:center}
a{color:#ffdd9b}.eyebrow{letter-spacing:.23em;font:700 11px system-ui,sans-serif;color:#c4a4d9}
h1{font-size:clamp(33px,6vw,66px);line-height:1.04;margin:18px 0;color:#e9bd6a;text-transform:uppercase}
p{line-height:1.6;color:#e2cba9}
progress{width:100%;height:15px;accent-color:#d7a656}
.small{font:13px system-ui,sans-serif;color:#c6b5ae}
button{background:#d8ae65;color:#170c22;padding:14px 20px;border:0;cursor:pointer;font-weight:800}
button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:4px}
</style>
</head>
<body>
<main id="loader">
<p class="eyebrow">ABEREWA GAME ARCADE · CONTROLLER-ONLY</p>
<h1>Thrones<br>of Akkad</h1>
<p>Loading the twelve-goddess playable prototype. All artwork and game data are being assembled from this GitHub Pages site.</p>
<progress id="progress" value="0" max="38"></progress>
<p class="small" id="status" role="status">Preparing game files…</p>
<p class="small">Use an Xbox or Logitech gamepad. No keyboard gameplay controls.</p>
<p><a href="./">Back to both games</a></p>
<button id="retry" hidden>Retry loading</button>
</main>
<script>
(function(){
'use strict';
const total=38,parts=Array(total),progress=document.getElementById('progress'),status=document.getElementById('status'),retry=document.getElementById('retry');
async function load(){
retry.hidden=true;status.textContent='Connecting to game files…';progress.value=0;let done=0, next=0;
try{
async function worker(){
while(next<total){
const i=next++;
const name='thrones-assets/part-'+String(i+1).padStart(3,'0')+'.txt';
const res=await fetch(name,{cache:'force-cache'});
if(!res.ok)throw Error('File '+(i+1)+' failed to load ('+res.status+').');
parts[i]=await res.text();
done++;progress.value=done;status.textContent='Loading game data: '+done+' / '+total+' parts';
}}
await Promise.all(Array.from({length:6},()=>worker()));
const game=parts.join('');
if(game.length<11000000||!game.includes('THRONES OF AKKAD')||!game.includes('</html>'))
throw Error('Game data did not pass the completeness check.');
status.textContent='Starting game…';
document.open();document.write(game);document.close();
}catch(e){
status.textContent='Unable to load the game: '+e.message;
retry.hidden=false;
}}
retry.addEventListener('click',load);
load();
})();
</script>
</body>
</html>
