<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RODA Xbox Controller Test</title><style>body{background:#111b17;color:#f6e8c5;font:18px system-ui;margin:0;padding:25px;max-width:800px}h1{color:#e4c36a}button,a{display:inline-block;padding:12px;margin:5px;background:#d9b85d;color:#111;border:0;border-radius:6px;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#26382f;padding:18px;border-radius:8px}#buttons{display:flex;flex-wrap:wrap;gap:8px}.key{padding:12px;background:#34443d;border-radius:5px}.on{background:#d9b85d;color:#111}</style><h1>RODA — Xbox controller test</h1><p>Connect your Xbox controller by USB or Bluetooth. Click <b>Activate controller</b>, then press A, B, X, Y, Start, or move either stick. This test runs independently of the fighting game.</p><button id="activate">Activate controller</button><a href="capoeira-angola-game.html">Return to RODA</a><p id="status" role="status">Waiting for input.</p><pre id="details">No data yet.</pre><div id="buttons"></div><script>
const status=document.getElementById('status'),details=document.getElementById('details'),keys=document.getElementById('buttons');let events=[];
for(const type of ['gamepadconnected','gamepaddisconnected'])window.addEventListener(type,e=>{events.push(type+': '+e.gamepad.id);events=events.slice(-4);});
document.getElementById('activate').onclick=()=>{status.textContent='Activated. Press a controller button now.';navigator.getGamepads?.();};
function update(){
let pads=[];try{pads=Array.from(navigator.getGamepads?.()||[]).filter(Boolean)}catch(e){status.textContent='Gamepad access error: '+e.message;}
if(!navigator.getGamepads){status.textContent='This browser does not support Gamepad API.';}
else if(!pads.length){status.textContent='No controller detected. Try USB, press A, then click Activate controller again.';}
else{const p=pads[0],pressed=p.buttons.map((b,i)=>b.pressed||b.value>.5?i:null).filter(i=>i!==null);status.textContent='Detected '+pads.length+' controller(s) · '+(pressed.length?'Button '+pressed.join(', ')+' pressed':'Move or press a button');keys.replaceChildren(...p.buttons.map((b,i)=>{const el=document.createElement('span');el.className='key'+(b.pressed||b.value>.5?' on':'');el.textContent=i+': '+b.value.toFixed(2);return el;}));details.textContent=JSON.stringify({name:p.id,mapping:p.mapping,connected:p.connected,axes:p.axes.map(n=>+n.toFixed(2)),buttons:p.buttons.length,events},null,2);}
requestAnimationFrame(update)}update();
</script></html>
